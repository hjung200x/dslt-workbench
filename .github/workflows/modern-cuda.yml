name: DSLT Workbench CUDA

on:
  workflow_dispatch:
  push:
    branches: [ main, master, 'codex/**' ]
    paths:
      - 'modern/native/**'
      - '.github/workflows/modern-cuda.yml'

jobs:
  cuda-build:
    name: cuda-build-only
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CUDA_VERSION: '13.2.2'
      CUDA_PATH: 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.2'
    steps:
      - uses: actions/checkout@v4
      - name: Install minimal CUDA 13.2 toolkit
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'cuda-network-installer.exe'
          $url = "https://developer.download.nvidia.com/compute/cuda/$env:CUDA_VERSION/network_installers/cuda_${env:CUDA_VERSION}_windows_network.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          $packages = @(
            '-s',
            'crt_13.2',
            'cudart_13.2',
            'nvcc_13.2',
            'nvfatbin_13.2',
            'nvptxcompiler_13.2',
            'nvvm_13.2',
            'visual_studio_integration_13.2'
          )
          $process = Start-Process -FilePath $installer -ArgumentList $packages -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) {
            throw "CUDA installer failed with exit code $($process.ExitCode)"
          }
          $nvcc = Join-Path $env:CUDA_PATH 'bin\nvcc.exe'
          if (-not (Test-Path -LiteralPath $nvcc)) {
            throw "CUDA compiler was not installed at $nvcc"
          }
          "$env:CUDA_PATH\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $nvcc --version
      - name: Configure CUDA backend
        working-directory: modern/native
        run: cmake --preset windows-cuda -T "cuda=$env:CUDA_PATH"
      - name: Compile CUDA backend and native tests
        working-directory: modern/native
        run: cmake --build --preset windows-cuda-release --target dslt_core dslt_native_tests dslt_czi dslt_czi_tests --parallel
      - name: Upload CUDA runtime test bundle
        uses: actions/upload-artifact@v4
        with:
          name: dslt-cuda-tests-win-x64-${{ github.sha }}
          path: modern/native/out/build/windows-cuda/Release/*
          if-no-files-found: error
          retention-days: 7

  cuda-parity:
    name: cuda-runtime-parity
    needs: cuda-build
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64, NVIDIA]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download hosted CUDA build
        uses: actions/download-artifact@v4
        with:
          name: dslt-cuda-tests-win-x64-${{ github.sha }}
          path: .run/cuda-artifact
      - name: Run CPU/CUDA parity and memory tests on NVIDIA GPU
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File modern/scripts/run-cuda-artifact-tests.ps1
          -ArtifactDirectory .run/cuda-artifact
          -EvidencePath .run/cuda-evidence/cuda-parity.json
      - name: Upload CUDA parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: dslt-cuda-evidence-win-x64-${{ github.sha }}
          path: .run/cuda-evidence/*
          if-no-files-found: error
