name: DSLT Workbench CI

on:
  push:
    branches: [ main, master, 'codex/**' ]
    paths:
      - 'modern/**'
      - 'COPYING.GPLv3'
      - 'license.txt'
      - '.github/workflows/modern-ci.yml'
  pull_request:
    paths:
      - 'modern/**'
      - 'COPYING.GPLv3'
      - 'license.txt'
      - '.github/workflows/modern-ci.yml'

jobs:
  managed:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build WPF application
        run: dotnet build modern/app/Dslt.App/Dslt.App.csproj --configuration Release
      - name: Run managed contract tests with source identity
        shell: pwsh
        env:
          DSLT_EXPECT_SOURCE_COMMIT: ${{ github.sha }}
        run: dotnet run --project modern/tests/Dslt.Managed.Tests/Dslt.Managed.Tests.csproj --configuration Release -p:SourceRevisionId=${{ github.sha }}
      - name: Build real-data validation tool
        run: dotnet build modern/tools/Dslt.Validation/Dslt.Validation.csproj --configuration Release
      - name: Build real-data preparation tool
        run: dotnet build modern/tools/Dslt.Validation.Prepare/Dslt.Validation.Prepare.csproj --configuration Release
      - name: Build headless real-data candidate tool
        run: dotnet build modern/tools/Dslt.Validation.Candidate/Dslt.Validation.Candidate.csproj --configuration Release
      - name: Verify preserved legacy distribution evidence
        shell: pwsh
        run: ./modern/scripts/verify-legacy-distribution.ps1
      - name: Verify public LSM interoperability lock
        shell: pwsh
        run: ./modern/scripts/verify-public-lsm-interoperability.ps1 -LockOnly
      - name: Verify public leaf input preflight lock
        shell: pwsh
        run: ./modern/scripts/verify-public-clsm-leaf-preflight.ps1 -LockOnly
      - name: Verify PlantSeg reference suitability lock
        shell: pwsh
        run: ./modern/scripts/verify-public-plantseg-reference-suitability.ps1 -LockOnly
      - name: Test fail-closed v1 release evidence gate
        shell: pwsh
        run: ./modern/scripts/test-v1-release-evidence.ps1
      - name: Run WPF I/O and workflow tests
        run: dotnet run --project modern/tests/Dslt.App.Tests/Dslt.App.Tests.csproj --configuration Release

  native-cpu:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Configure native core
        working-directory: modern/native
        run: cmake --preset windows-cpu
      - name: Build native core
        working-directory: modern/native
        run: cmake --build --preset windows-cpu-release
      - name: Run native synthetic tests
        working-directory: modern/native
        run: ctest --preset windows-cpu
      - name: Run managed-to-native ABI and WPF integration tests
        shell: pwsh
        run: |
          $env:PATH = "$PWD\modern\native\out\build\windows-cpu\Release;$env:PATH"
          dotnet run --project modern/tests/Dslt.Managed.Tests/Dslt.Managed.Tests.csproj --configuration Release
          dotnet run --project modern/tests/Dslt.App.Tests/Dslt.App.Tests.csproj --configuration Release
      - name: Configure native AddressSanitizer build
        working-directory: modern/native
        run: cmake --preset windows-cpu-asan
      - name: Build native AddressSanitizer tests
        working-directory: modern/native
        run: cmake --build --preset windows-cpu-asan
      - name: Copy AddressSanitizer runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.ASAN -property installationPath
          if (-not $vsRoot) { throw "Visual Studio AddressSanitizer component was not found." }
          $runtime = Get-ChildItem -Path "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll" |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $runtime) { throw "AddressSanitizer runtime DLL was not found." }
          Copy-Item -LiteralPath $runtime.FullName -Destination "modern\native\out\build\windows-cpu-asan\RelWithDebInfo" -Force
      - name: Run native AddressSanitizer stress tests
        working-directory: modern/native
        shell: pwsh
        run: |
          $env:ASAN_OPTIONS = "halt_on_error=1:abort_on_error=1:detect_leaks=0"
          ctest --preset windows-cpu-asan
      - name: Build and verify self-contained preview package
        shell: pwsh
        run: ./modern/scripts/package-preview.ps1 -SkipNativeBuild -Version "0.1.0-preview.${{ github.run_number }}"
      - name: Run packaged WPF host smoke test
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath modern/artifacts/preview -Filter '*.zip')
          if ($archives.Count -ne 1) {
            throw "Expected exactly one preview ZIP, found $($archives.Count)."
          }
          $packageRoot = Join-Path `
            $env:RUNNER_TEMP `
            "dslt-packaged-host-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $packageRoot) {
            throw "Packaged host-smoke target already exists: $packageRoot"
          }
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $packageRoot
          ./modern/scripts/test-windows-host.ps1 `
            -PackageRoot $packageRoot `
            -EvidencePath modern/artifacts/preview/windows-host-smoke.json
      - name: Upload verified preview package
        uses: actions/upload-artifact@v4
        with:
          name: dslt-workbench-preview-win-x64-${{ github.run_number }}
          path: modern/artifacts/preview/*
          if-no-files-found: error
